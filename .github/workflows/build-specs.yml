name: build-specs
on: push
jobs:
  load_config:
    runs-on: ubuntu-latest
    outputs:
      dbversion: ${{ steps.load.dbversion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Load the configuration
        id: load
        run: |
          echo dbversion=`cat gradle.properties | grep "^docbookBaseVersion" | cut -f2 -d` >> $GITHUB_OUTPUT

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: load_config
    env:
      HAVE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN != '' }}
      BRANCH_NAME: ${{ github.ref_name }}
      DBVERSION: ${{ needs.load_config.outputs.dbversion }}

    steps:
      # We need all the history to find when pages were changed.
      # I should probably change things so that this isn’t necessary.
      - name: Checkout the specifications
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build
        run: |
          ./gradlew dist

      - name: Deploy docbook-5.2 to specifications
        run: |
          echo Deploy ${{ env.DBVERSION }}

